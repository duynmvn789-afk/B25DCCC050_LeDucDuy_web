<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Giới Thiệu Tương Tác</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease;
      background-color: #f4f6f9;
      color: #333;
      scroll-behavior: smooth;
    }
    header, nav, main, footer {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    header {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      border-radius: 0 0 8px 8px;
    }
    nav {
      display: flex;
      gap: 15px;
      justify-content: center;
      background-color: #ecf0f1;
      margin-top: 10px;
      border-radius: 6px;
      position: sticky;
      top: 0;
    }
    nav a {
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    nav a:hover {
      text-decoration: none;
      background-color: #bdc3c7;
      color: #2c3e50;
    }
    main {
      background-color: white;
      margin-top: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding-bottom: 30px;
    }
    section {
      margin-bottom: 40px;
      padding-top: 20px;
    }
    section h2 {
      color: #2c3e50;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 5px;
    }
    #greeting {
      font-size: 1.25rem;
      font-weight: bold;
      color: #e67e22;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 12px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    ul {
      line-height: 1.6;
    }
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-top: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body id="mainBody">

  <header>
    <h1>Hồ Sơ Cá Nhân</h1>
  </header>

  <nav>
    <a href="#about">Giới thiệu</a>
    <a href="#skills">Kỹ năng</a>
    <a href="#contact">Liên hệ</a>
  </nav>

  <main>
    <section id="about">
      <h2>Về tôi</h2>
      <p id="greeting">Đang tải lời chào...</p>
      <p>Chào mừng bạn đến với trang giới thiệu bản thân được xây dựng bằng HTML, CSS và JavaScript. Trang web này có khả năng phản hồi tương tác cơ bản với người dùng.</p>
      
      <button id="btnChangeBg">🎨 Đổi màu nền trang web</button>
    </section>
  <footer>
    <p>&copy; Được làm bởi Lê Đức Duy</p>
  </footer>

  <script>
    const greetingElement = document.getElementById("greeting");
    const currentHour = new Date().getHours();
    let greetingText = "";

    if (currentHour >= 5 && currentHour < 12) {
      greetingText = "🌅 Chào buổi sáng! Chúc bạn một ngày mới tràn đầy năng lượng.";
    } else if (currentHour >= 12 && currentHour < 18) {
      greetingText = "☀️ Chào buổi chiều! Chúc bạn hoàn thành tốt công việc.";
    } else {
      greetingText = "🌙 Chào buổi tối! Chúc bạn có thời gian nghỉ ngơi thư giãn.";
    }

    greetingElement.innerText = greetingText;

    const changeBgButton = document.getElementById("btnChangeBg");
    const bodyElement = document.getElementById("mainBody");

    const colorPalette = [
      "#f4f6f9", 
      "#e8f8f5",
      "#fef9e7",
      "#ebf5fb", 
      "#f9ebea",
      "#f5eef8"
    ];
    let currentColorIndex = 0;

    changeBgButton.addEventListener("click", function() {
      currentColorIndex = (currentColorIndex + 1) % colorPalette.length;
      bodyElement.style.backgroundColor = colorPalette[currentColorIndex];
    });
  </script>
</body>
</html>
